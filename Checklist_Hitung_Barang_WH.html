<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Checklist Hitung Barang — WH</title>
<style>
  :root{
    --navy-900:#0b2545;
    --navy-800:#12345f;
    --navy-700:#1a4a80;
    --navy-600:#2563a8;
    --blue-accent:#2f7fd6;
    --green:#1b8a5a;
    --green-bg:#e6f6ee;
    --amber:#b8860b;
    --red:#c0392b;
    --bg:#f3f5f8;
    --card:#ffffff;
    --border:#e1e6ee;
    --text:#1c2a3a;
    --text-dim:#5c6b7d;
    --radius:10px;
    --shadow:0 1px 3px rgba(11,37,69,0.08), 0 1px 2px rgba(11,37,69,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
  }

  /* Header */
  .topbar{
    background:linear-gradient(135deg,var(--navy-900),var(--navy-700));
    color:#fff;
    padding:16px 16px 20px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:var(--shadow);
  }
  .topbar h1{
    margin:0 0 2px;
    font-size:17px;
    font-weight:700;
    letter-spacing:.2px;
  }
  .topbar .sub{
    font-size:12px;
    color:#c7d6ea;
    margin-bottom:14px;
  }
  .progress-wrap{
    background:rgba(255,255,255,0.12);
    border-radius:999px;
    height:10px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,#3fd28c,#1b8a5a);
    border-radius:999px;
    width:0%;
    transition:width .35s ease;
  }
  .progress-stats{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-top:6px;
    color:#dfe9f5;
  }
  .progress-stats strong{color:#fff;font-size:13px;}

  /* Controls */
  .controls{
    padding:12px 16px;
    background:var(--card);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:96px;
    z-index:19;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .search-row{
    display:flex;
    gap:8px;
  }
  .search-row input[type="text"]{
    flex:1;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    background:#f8fafc;
    color:var(--text);
  }
  .search-row input[type="text"]:focus{
    outline:none;
    border-color:var(--blue-accent);
    background:#fff;
  }
  select#lorongFilter{
    padding:10px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    background:#f8fafc;
    color:var(--text);
    max-width:120px;
  }
  .chip-row{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
  }
  .chip{
    flex:none;
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--border);
    background:#f8fafc;
    font-size:12px;
    font-weight:600;
    color:var(--text-dim);
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--navy-700);
    border-color:var(--navy-700);
    color:#fff;
  }
  .action-row{
    display:flex;
    gap:8px;
    margin-top:2px;
  }
  .btn{
    flex:1;
    padding:9px 10px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#f8fafc;
    font-size:12.5px;
    font-weight:600;
    color:var(--navy-800);
    cursor:pointer;
  }
  .btn.primary{
    background:var(--navy-700);
    border-color:var(--navy-700);
    color:#fff;
  }
  .btn.danger{
    color:var(--red);
    border-color:#f1c3bd;
    background:#fdf2f0;
  }

  /* Tabs */
  .tabs{
    display:flex;
    background:var(--card);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:calc(96px + 118px);
    z-index:18;
  }
  .tabs button{
    flex:1;
    padding:11px 0;
    background:none;
    border:none;
    font-size:13px;
    font-weight:700;
    color:var(--text-dim);
    border-bottom:3px solid transparent;
    cursor:pointer;
  }
  .tabs button.active{
    color:var(--navy-700);
    border-bottom-color:var(--navy-700);
  }

  main{
    padding:12px 16px 40px;
    max-width:760px;
    margin:0 auto;
  }

  /* Lorong group */
  .lorong-group{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:10px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .lorong-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 14px;
    cursor:pointer;
    background:#fafcff;
  }
  .lorong-header:active{background:#f0f4f9;}
  .lorong-header .name{
    font-weight:700;
    font-size:14.5px;
    color:var(--navy-900);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .lorong-header .caret{
    transition:transform .2s ease;
    color:var(--text-dim);
    font-size:11px;
  }
  .lorong-header.open .caret{transform:rotate(90deg);}
  .lorong-header .meta{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .lorong-count{
    font-size:12px;
    color:var(--text-dim);
    font-variant-numeric:tabular-nums;
  }
  .mini-bar{
    width:54px;
    height:6px;
    background:#e6ebf2;
    border-radius:999px;
    overflow:hidden;
  }
  .mini-bar-fill{
    height:100%;
    background:var(--green);
    border-radius:999px;
  }
  .badge-done{
    font-size:10.5px;
    font-weight:700;
    color:var(--green);
    background:var(--green-bg);
    padding:2px 7px;
    border-radius:999px;
  }

  .lokasi-list{
    display:none;
    border-top:1px solid var(--border);
  }
  .lokasi-list.open{display:block;}
  .lokasi-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    border-bottom:1px solid #f0f3f7;
    font-size:13.5px;
  }
  .lokasi-item:last-child{border-bottom:none;}
  .lokasi-item.checked{background:var(--green-bg);}
  .lokasi-item input[type="checkbox"]{
    width:20px;
    height:20px;
    accent-color:var(--green);
    flex:none;
    cursor:pointer;
  }
  .lokasi-item .code{
    font-family:"SF Mono",Consolas,monospace;
    letter-spacing:.3px;
    color:var(--text);
    flex:1;
  }
  .lokasi-item.checked .code{
    color:var(--green);
    text-decoration:line-through;
    text-decoration-color:#9fd4b8;
  }
  .lokasi-item .lorong-tag{
    font-size:10.5px;
    font-weight:700;
    color:var(--navy-600);
    background:#e9f1fb;
    padding:2px 6px;
    border-radius:5px;
  }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text-dim);
    font-size:13.5px;
  }

  /* Recap table */
  .recap-card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--border);
    overflow:hidden;
    margin-bottom:14px;
  }
  table.recap{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  table.recap th{
    background:var(--navy-800);
    color:#fff;
    padding:9px 8px;
    text-align:left;
    font-weight:600;
    position:sticky;
    top:0;
  }
  table.recap th:nth-child(2),
  table.recap th:nth-child(3),
  table.recap th:nth-child(4){text-align:right;}
  table.recap td{
    padding:8px;
    border-bottom:1px solid #f0f3f7;
    color:var(--text);
  }
  table.recap td:nth-child(2),
  table.recap td:nth-child(3),
  table.recap td:nth-child(4){
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  table.recap tr.total-row td{
    background:#eef3fa;
    font-weight:700;
    border-top:2px solid var(--navy-700);
  }
  table.recap td.pct{
    font-weight:700;
  }
  table.recap td.pct.full{color:var(--green);}
  table.recap td.pct.mid{color:var(--amber);}
  table.recap td.pct.low{color:var(--red);}
  .recap-bar-cell{
    width:70px;
  }
  .recap-mini-bar{
    width:100%;
    height:5px;
    background:#e6ebf2;
    border-radius:999px;
    overflow:hidden;
    margin-top:3px;
  }
  .recap-mini-fill{
    height:100%;
    background:var(--green);
  }

  .section-title{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:var(--text-dim);
    margin:14px 4px 8px;
  }

  #recapView{display:none;}
  #toast{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy-900);
    color:#fff;
    padding:10px 18px;
    border-radius:8px;
    font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  footer{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    padding:10px 0 24px;
  }

  @media (min-width:640px){
    .lorong-list-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Checklist Hitung Barang</h1>
  <div class="sub">Lokasi Aktif WH — Support Back TLC</div>
  <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-stats">
    <span><strong id="doneCount">0</strong> / <span id="totalCount">0</span> lokasi selesai</span>
    <strong id="pctText">0%</strong>
  </div>
</div>

<div class="controls">
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Cari kode lokasi... (mis. W010010101)">
    <select id="lorongFilter">
      <option value="">Semua</option>
    </select>
  </div>
  <div class="action-row">
    <button class="btn" id="btnExpandAll">Buka Semua</button>
    <button class="btn" id="btnCollapseAll">Tutup Semua</button>
    <button class="btn danger" id="btnReset">Reset</button>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="checklist">Checklist</button>
  <button class="tab-btn" data-tab="recap">Rekap</button>
</div>

<main>
  <div id="checklistView">
    <div class="section-title" id="listCounter">Menampilkan semua lorong</div>
    <div id="lorongContainer"></div>
    <div class="empty-state" id="emptyState" style="display:none;">Tidak ada lokasi yang cocok dengan pencarian.</div>
  </div>

  <div id="recapView">
    <div class="section-title" style="display:flex;align-items:center;justify-content:space-between;">
      <span>Rekap Progress by Lorong</span>
      <button class="btn primary" id="btnDownloadRecapPng" style="flex:none;padding:7px 14px;">⬇ Download PNG</button>
    </div>
    <div class="recap-card">
      <table class="recap" id="recapTable">
        <thead>
          <tr>
            <th>Lorong</th>
            <th>Total</th>
            <th>Hitung</th>
            <th>%</th>
          </tr>
        </thead>
        <tbody id="recapBody"></tbody>
        <tfoot id="recapFoot"></tfoot>
      </table>
    </div>
  </div>
</main>

<footer>Progress tersimpan otomatis di perangkat ini (offline)</footer>
<div id="toast"></div>

const STORAGE_KEY = 'wh_checklist_progress_v1';
let checkedSet = new Set();
let openLorong = new Set();
let currentFilterLorong = '';
let currentSearch = '';

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      checkedSet = new Set(arr);
    }
  }catch(e){ checkedSet = new Set(); }
}
function saveProgress(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(checkedSet)));
  }catch(e){}
}

function groupByLorong(data){
  const map = {};
  data.forEach(item=>{
    if(!map[item.lorong]) map[item.lorong] = [];
    map[item.lorong].push(item.lokasi);
  });
  return map;
}
const grouped = groupByLorong(LOKASI_DATA);
const lorongList = Object.keys(grouped).sort();

function populateLorongFilter(){
  const sel = document.getElementById('lorongFilter');
  lorongList.forEach(l=>{
    const opt = document.createElement('option');
    opt.value = l;
    opt.textContent = l;
    sel.appendChild(opt);
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function computeLorongStats(lorong){
  const items = grouped[lorong] || [];
  const total = items.length;
  const done = items.filter(k=>checkedSet.has(k)).length;
  return {total, done, pct: total? Math.round(done/total*100):0};
}

function computeOverallStats(){
  const total = LOKASI_DATA.length;
  const done = checkedSet.size;
  return {total, done, pct: total? Math.round(done/total*100):0};
}

function renderTopProgress(){
  const {total, done, pct} = computeOverallStats();
  document.getElementById('doneCount').textContent = done;
  document.getElementById('totalCount').textContent = total;
  document.getElementById('pctText').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function matchesSearch(code){
  if(!currentSearch) return true;
  return code.toUpperCase().includes(currentSearch.toUpperCase());
}

function renderChecklist(){
  const container = document.getElementById('lorongContainer');
  container.innerHTML = '';
  let visibleLorongCount = 0;
  let visibleItemCount = 0;

  const lorongsToShow = currentFilterLorong ? [currentFilterLorong] : lorongList;

  lorongsToShow.forEach(lorong=>{
    const items = grouped[lorong].filter(code=>matchesSearch(code));
    if(items.length === 0) return;
    visibleLorongCount++;
    visibleItemCount += items.length;

    const stats = computeLorongStats(lorong);
    const isOpen = openLorong.has(lorong) || !!currentSearch || !!currentFilterLorong;

    const groupEl = document.createElement('div');
    groupEl.className = 'lorong-group';

    const headerEl = document.createElement('div');
    headerEl.className = 'lorong-header' + (isOpen ? ' open' : '');
    headerEl.innerHTML = `
      <div class="name"><span class="caret">▶</span> ${lorong}</div>
      <div class="meta">
        <span class="lorong-count">${stats.done}/${stats.total}</span>
        <div class="mini-bar"><div class="mini-bar-fill" style="width:${stats.pct}%"></div></div>
        ${stats.pct===100 ? '<span class="badge-done">✓ Selesai</span>' : ''}
      </div>
    `;
    headerEl.addEventListener('click', ()=>{
      if(openLorong.has(lorong)) openLorong.delete(lorong);
      else openLorong.add(lorong);
      renderChecklist();
    });

    const listEl = document.createElement('div');
    listEl.className = 'lokasi-list' + (isOpen ? ' open' : '');

    items.forEach(code=>{
      const isChecked = checkedSet.has(code);
      const itemEl = document.createElement('label');
      itemEl.className = 'lokasi-item' + (isChecked ? ' checked' : '');
      itemEl.innerHTML = `
        <input type="checkbox" ${isChecked ? 'checked' : ''} data-code="${code}">
        <span class="code">${code}</span>
        <span class="lorong-tag">${lorong}</span>
      `;
      const cb = itemEl.querySelector('input');
      cb.addEventListener('change', ()=>{
        if(cb.checked) checkedSet.add(code);
        else checkedSet.delete(code);
        saveProgress();
        itemEl.classList.toggle('checked', cb.checked);
        renderTopProgress();
        updateLorongHeaderInline(lorong, headerEl);
      });
      listEl.appendChild(itemEl);
    });

    groupEl.appendChild(headerEl);
    groupEl.appendChild(listEl);
    container.appendChild(groupEl);
  });

  document.getElementById('emptyState').style.display = visibleItemCount === 0 ? 'block' : 'none';

  const counterEl = document.getElementById('listCounter');
  if(currentSearch){
    counterEl.textContent = `${visibleItemCount} lokasi cocok dengan "${currentSearch}"`;
  } else if(currentFilterLorong){
    counterEl.textContent = `Lorong ${currentFilterLorong}`;
  } else {
    counterEl.textContent = `Menampilkan semua lorong (${lorongList.length} lorong, ${LOKASI_DATA.length} lokasi)`;
  }
}

function updateLorongHeaderInline(lorong, headerEl){
  const stats = computeLorongStats(lorong);
  headerEl.querySelector('.lorong-count').textContent = `${stats.done}/${stats.total}`;
  headerEl.querySelector('.mini-bar-fill').style.width = stats.pct + '%';
  const badge = headerEl.querySelector('.badge-done');
  if(stats.pct === 100 && !badge){
    const meta = headerEl.querySelector('.meta');
    const b = document.createElement('span');
    b.className = 'badge-done';
    b.textContent = '✓ Selesai';
    meta.appendChild(b);
  } else if(stats.pct < 100 && badge){
    badge.remove();
  }
}

function renderRecap(){
  const tbody = document.getElementById('recapBody');
  const tfoot = document.getElementById('recapFoot');
  tbody.innerHTML = '';
  tfoot.innerHTML = '';

  let totalAll = 0, doneAll = 0;

  lorongList.forEach(lorong=>{
    const stats = computeLorongStats(lorong);
    totalAll += stats.total;
    doneAll += stats.done;
    const pctClass = stats.pct === 100 ? 'full' : (stats.pct >= 50 ? 'mid' : 'low');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${lorong}</td>
      <td>${stats.total}</td>
      <td>${stats.done}</td>
      <td class="pct ${pctClass}">${stats.pct}%
        <div class="recap-mini-bar"><div class="recap-mini-fill" style="width:${stats.pct}%"></div></div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  const overallPct = totalAll ? Math.round(doneAll/totalAll*100) : 0;
  const totalRow = document.createElement('tr');
  totalRow.className = 'total-row';
  totalRow.innerHTML = `
    <td>TOTAL</td>
    <td>${totalAll}</td>
    <td>${doneAll}</td>
    <td class="pct ${overallPct===100?'full':(overallPct>=50?'mid':'low')}">${overallPct}%</td>
  `;
  tfoot.appendChild(totalRow);
}

function pctColor(pct){
  if(pct === 100) return '#1b8a5a';
  if(pct >= 50) return '#b8860b';
  return '#c0392b';
}

function downloadRecapPng(){
  const rows = lorongList.map(lorong=>({lorong, ...computeLorongStats(lorong)}));
  const overall = computeOverallStats();

  const scale = 2; // retina-quality output
  const width = 640;
  const padX = 20;
  const titleH = 74;
  const headerH = 40;
  const rowH = 32;
  const totalRowH = 38;
  const footerH = 34;
  const tableTop = titleH;
  const tableH = headerH + rows.length * rowH + totalRowH;
  const height = titleH + tableH + footerH;

  const canvas = document.createElement('canvas');
  canvas.width = width * scale;
  canvas.height = height * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  // background
  ctx.fillStyle = '#f3f5f8';
  ctx.fillRect(0, 0, width, height);

  // Title block
  const grad = ctx.createLinearGradient(0, 0, width, 0);
  grad.addColorStop(0, '#0b2545');
  grad.addColorStop(1, '#1a4a80');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, width, titleH);

  ctx.fillStyle = '#ffffff';
  ctx.font = '700 17px Arial, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText('Rekap Progress Hitung Barang', padX, 28);

  ctx.font = '400 12px Arial, sans-serif';
  ctx.fillStyle = '#c7d6ea';
  ctx.fillText('by Lorong — Support Back TLC', padX, 48);

  const now = new Date();
  const dateStr = now.toLocaleDateString('id-ID', {day:'2-digit', month:'long', year:'numeric'}) +
                  ' ' + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
  ctx.font = '400 11px Arial, sans-serif';
  ctx.fillStyle = '#9fb3cc';
  ctx.fillText(dateStr, padX, 64);

  // Column layout
  const colX = {
    lorong: padX,
    total: 260,
    hitung: 380,
    pct: width - padX
  };

  // Table header
  let y = tableTop;
  ctx.fillStyle = '#0b2545';
  ctx.fillRect(0, y, width, headerH);
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 12.5px Arial, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText('LORONG', colX.lorong, y + headerH/2);
  ctx.textAlign = 'right';
  ctx.fillText('TOTAL', colX.total, y + headerH/2);
  ctx.fillText('HITUNG', colX.hitung, y + headerH/2);
  ctx.fillText('%', colX.pct, y + headerH/2);
  ctx.textAlign = 'left';
  y += headerH;

  // Rows
  rows.forEach((r, idx)=>{
    ctx.fillStyle = idx % 2 === 0 ? '#ffffff' : '#f7f9fc';
    ctx.fillRect(0, y, width, rowH);

    ctx.strokeStyle = '#eef1f5';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, y + rowH);
    ctx.lineTo(width, y + rowH);
    ctx.stroke();

    ctx.fillStyle = '#1c2a3a';
    ctx.font = '700 12.5px Arial, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(r.lorong, colX.lorong, y + rowH/2);

    ctx.font = '400 12.5px Arial, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(String(r.total), colX.total, y + rowH/2);
    ctx.fillText(String(r.done), colX.hitung, y + rowH/2);

    ctx.font = '700 12.5px Arial, sans-serif';
    ctx.fillStyle = pctColor(r.pct);
    ctx.fillText(r.pct + '%', colX.pct, y + rowH/2);
    ctx.textAlign = 'left';

    // mini progress bar under percentage area (spans hitung->pct zone lightly), draw small bar left-aligned after lorong col
    const barX = colX.lorong + 90;
    const barW = 110;
    const barH = 5;
    const barY = y + rowH/2 - barH/2;
    ctx.fillStyle = '#e6ebf2';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = pctColor(r.pct);
    ctx.fillRect(barX, barY, barW * (r.pct/100), barH);

    y += rowH;
  });

  // Total row
  ctx.fillStyle = '#eef3fa';
  ctx.fillRect(0, y, width, totalRowH);
  ctx.strokeStyle = '#1a4a80';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, y);
  ctx.lineTo(width, y);
  ctx.stroke();

  ctx.fillStyle = '#0b2545';
  ctx.font = '700 13.5px Arial, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText('TOTAL', colX.lorong, y + totalRowH/2);
  ctx.textAlign = 'right';
  ctx.fillText(String(overall.total), colX.total, y + totalRowH/2);
  ctx.fillText(String(overall.done), colX.hitung, y + totalRowH/2);
  ctx.fillStyle = pctColor(overall.pct);
  ctx.fillText(overall.pct + '%', colX.pct, y + totalRowH/2);
  ctx.textAlign = 'left';
  y += totalRowH;

  // Footer note
  ctx.fillStyle = '#8a97a8';
  ctx.font = '400 10.5px Arial, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText('Dibuat otomatis dari Checklist Hitung Barang WH', padX, y + footerH/2);

  canvas.toBlob(function(blob){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const fileDate = now.toISOString().slice(0,10);
    a.href = url;
    a.download = `Rekap_Hitung_Barang_${fileDate}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast('PNG rekap berhasil diunduh');
  }, 'image/png');
}

function attachControls(){
  document.getElementById('btnDownloadRecapPng').addEventListener('click', downloadRecapPng);
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    currentSearch = e.target.value.trim();
    renderChecklist();
  });
  document.getElementById('lorongFilter').addEventListener('change', (e)=>{
    currentFilterLorong = e.target.value;
    renderChecklist();
  });
  document.getElementById('btnExpandAll').addEventListener('click', ()=>{
    lorongList.forEach(l=>openLorong.add(l));
    renderChecklist();
  });
  document.getElementById('btnCollapseAll').addEventListener('click', ()=>{
    openLorong.clear();
    renderChecklist();
  });
  document.getElementById('btnReset').addEventListener('click', ()=>{
    if(confirm('Reset semua progress checklist? Tindakan ini tidak bisa dibatalkan.')){
      checkedSet.clear();
      saveProgress();
      renderTopProgress();
      renderChecklist();
      renderRecap();
      showToast('Progress direset');
    }
  });

  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      document.getElementById('checklistView').style.display = tab==='checklist' ? 'block' : 'none';
      document.getElementById('recapView').style.display = tab==='recap' ? 'block' : 'none';
      if(tab==='recap') renderRecap();
    });
  });
}

function init(){
  loadProgress();
  populateLorongFilter();
  attachControls();
  renderTopProgress();
  renderChecklist();
  renderRecap();
}
init();
</script>
</body>
</html>
