<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Tidak Tersedia</title>
<style>
  :root{
    --bg: #101216;
    --bg-2: #17191f;
    --line: #2a2d35;
    --ink: #eceef1;
    --muted: #8b909c;
    --accent: #e8a34c;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    -webkit-font-smoothing: antialiased;
  }

  body{
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(232,163,76,0.05), transparent 40%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
  }

  .card{
    max-width: 480px;
    width: 100%;
    border: 1px solid var(--line);
    background: var(--bg-2);
    padding: 48px 40px;
    position: relative;
  }

  .card::before{
    content: "";
    position: absolute;
    top: -1px; left: -1px;
    width: 18px; height: 18px;
    border-top: 2px solid var(--accent);
    border-left: 2px solid var(--accent);
  }
  .card::after{
    content: "";
    position: absolute;
    bottom: -1px; right: -1px;
    width: 18px; height: 18px;
    border-bottom: 2px solid var(--accent);
    border-right: 2px solid var(--accent);
  }

  .tag{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
  }

  .tag .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,163,76,0.15);
  }

  h1{
    font-size: 22px;
    font-weight: 500;
    line-height: 1.5;
    margin: 0 0 16px 0;
    color: var(--ink);
    letter-spacing: -0.01em;
  }

  p.sub{
    font-size: 14px;
    line-height: 1.7;
    color: var(--muted);
    margin: 0 0 32px 0;
  }

  .meta{
    border-top: 1px solid var(--line);
    padding-top: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .meta span b{
    color: var(--ink);
    font-weight: 500;
  }

  @media (max-width: 480px){
    .card{ padding: 36px 24px; }
    h1{ font-size: 19px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="tag"><span class="dot"></span>Status Halaman</div>

    <h1>Mohon maaf, halaman ini sudah tidak tersedia, sampai waktu yang tidak ditentukan.</h1>
    <p class="sub">Silakan hubungi pihak terkait apabila Anda memerlukan informasi lebih lanjut.</p>

    <div class="meta">
      <span>Kode: <b>410</b></span>
      <span>Diperbarui otomatis</span>
    </div>
  </div>

</body>
</html>
